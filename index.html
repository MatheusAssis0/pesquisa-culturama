<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">

    <title>Pesquisa Culturama</title>
</head>
<body>
  <main>
    <header>
        <img src="img/logo-culturama.png" alt="Logo da Culturama">
        <h1>Pesquisa de opinião</h1>
    </header>

    <section>
        <form action="sucesso.html" method="get">
            
            <fieldset>

                <!-- DADOS PESSOAIS -->
                <legend>Dados Pessoais</legend>
                <label for="name">Nome</label>
                <input id="name" type="text" name="userName" required>
                <br>
                <label for="age">Idade</label>
                <input id="age" type="number" name="userAge" min="12" max="100" required>
                <br>
                <label for="birthDate">Data de Nascimento</label>
                <input id="birthDate" type="date" name="useBirthDate">
                <br>
                <label for="email">Email</label>
                <input id="email" type="email" name="userEmail" required>
                <br>
                <label for="phoneNumber">Telefone</label>
                <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + número sem espaço ou hífen" aria-describedby="phoneHelp">
                <small id="phoneHelp">Preencha com 11 dígitos no formato: DDD + número sem espaços ou hífen.</small>
                <br>
                <label for="image">Upload de Foto</label>
                <input id="image" type="file" accept="image/*" name="userImage" aria-describedby="imageHelp">
                <small id="imageHelp">Envie uma foto no formato PNG ou JPEG.</small>
            </fieldset>

            <fieldset>

                <!-- PERFIL DO USUARIO -->
                <legend>Perfil</legend>

                <p>Gênero:</p>

                <input id="male" type="radio" name="userGender" value="Masculino">
                <label for="male">Masculino</label>

                <input id="female" type="radio" name="userGender" value="Feminino">
                <label for="female">Feminino</label>

                <input id="notInformed" type="radio" name="userGender" value="notInformed">
                <label for="notInformed">Prefiro não informar</label>
                <br>

                <label for="maritalStatus">Estado Civil:</label>
                <select id="maritalStatus" name="userMaritalStatus" required>
                    <option value="notInformed">Selecione</option>
                    <option value="single">Solteiro(a)</option>
                    <option value="married">Casado(a)</option>
                    <option value="divorced">Divorciado(a)</option>
                    <option value="widowed">Viúvo(a)</option>
                </select>
                <br>

                <label for="state">Estado:</label>
                <select id="state" name="userState" required>
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="distritoFederal">Distrito Federal</option>
                    <option value="espiritoSanto">Espirito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                    <option value="matoGrosso">Mato Grosso</option>
                    <option value="minasGerais">Minas Gerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piauí</option>
                    <option value="rioDeJaneiro">Rio de Janeiro</option>
                    <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                    <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                    <option value="rondonia">Rondônia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santaCatarina">Santa Catarina</option>
                    <option value="saoPaulo">São Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>
                </select>
                <br>

                <label for="city">Cidade:</label>
                <input id="city" type="text" name="userCity" placeholder="Digite o nome da sua cidade">
            </fieldset>

            <fieldset>
                <legend>Hábitos</legend>

                <p>Redes sociais:</p>
                <input id="instagram" type="checkbox" name="social" value="instagram">
                <label for="instagram">Instagram</label>
                <br>
                <input id="facebook" type="checkbox" name="social" value="facebook">
                <label for="facebook">Facebook</label>
                <br>
                <input id="X" type="checkbox" name="social" value="X">
                <label for="X">X</label>
                <br>
                <input id="linkedin" type="checkbox" name="social" value="linkedin">
                <label for="linkedin">LinkedIn</label>
                <br>

                <label for="musicStyle">Estilo musical:</label>
                <input list="styleTypes" id="musicStyle" type="text" name="userMusicStyle">
                <datalist id="styleTypes">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Sertanejo">
                    <option value="Funk">
                    <option value="MPB">
                    <option value="Eletrônica">
                    <option value="Hip Hop">
                    <option value="Forró">
                </datalist>
                <br>

                <label for="favoriteColor">Cor favorita:</label>
                <input id="favoriteColor" type="color" name="userColor">
            </fieldset>

            <fieldset>
                <legend>Opinião</legend>
                <br>
                <p>Como você avalia nosso serviço?</p>
                <input type="radio" id="verySatisfied" name="userSatisfaction" value="verySatisfied">
                <label for="verySatisfied">Ótimo</label>
                <br>
                <input type="radio" id="satisfied" name="userSatisfaction" value="satisfied">
                <label for="satisfied">Bom</label>
                <br>
                <input type="radio" id="neutral" name="userSatisfaction" value="neutral">
                <label for="neutral">Regular</label>
                <br>    
                <input type="radio" id="bad" name="userSatisfaction" value="bad">
                <label for="bad">Ruim</label>
                <br>

                <label for="opinion">Escreva sua opinião:</label>
                <textarea id="opinion" name="userOpinion" placeholder="Compartilhe sua opinião sobre como foi sua experiência"></textarea>
            </fieldset>

            <fieldset>
                <legend>Confirmações</legend>
                <br>

                <input id="userLgpdTerm" type="checkbox" name="userLgpd" value="true" required>
                <label for="userLgpdTerm">Confirmo que as informações fornecidas são verdadeiras e autorizo o uso dos dados para fins de pesquisa.</label>
                <br>

                <input id="getResult" type="checkbox" name="userGetResult" value="true">
                <label for="getResult">Desejo receber os resultados da pesquisa pelo email.</label>
            </fieldset>

            <br>
            <button type="submit" aria-label="Enviar formulário">Enviar</button>
            <button type="reset" aria-label="Limpar formulário">Limpar</button>
        </form>
    </section>
  </main>
</body>
</html>
